<!DOCTYPE html>
<html>
<head>
    <title>Hum To Tab</title>
</head>

<body>

    <h1>Hum to Tab</h1>

    <p>Turn a melody into guitar tab.</p>

    <button id="startButton">Start Microphone</button>
    <button id="stopButton">Stop Microphone</button>

    <br><br>

    <button id="captureButton">Capture Note</button>
    <button id="clearButton">Clear Notes</button>

    <p id="status">Microphone off</p>

    <p id="frequencyDisplay">Frequency: -- Hz</p>

    <p id="noteDisplay">Note: --</p>

    <h2>Captured Melody</h2>

    <p id="melodyDisplay">No notes captured yet.</p>

    <h2>Guitar Positions</h2>

    <pre id="tabOutput"></pre>

    <script src="app.js?v=8"></script>

</body>
</html>
